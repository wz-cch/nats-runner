# TwinBuilder / tb-package 一體化模板
# 涵蓋：ResourceType(twinbuilder)、SRPType(tb-package)、Usage Stats 全部 CRUD + 查詢 + 上報
#
# 內建變數：{{uuid}}（UUID v4）、{{now_ms}}（epoch ms）
#
# ── 快速上手 ─────────────────────────────────────────────────────
#
# 【初始化（依序執行）】
#   1. 建立 resource type
#      ./nats-runner -t templates/tb_package.toml -n resource_create
#
#   2. 建立 SRP type
#      ./nats-runner -t templates/tb_package.toml -n srp_create
#
# 【用量上報（JetStream）】
#   ./nats-runner -t templates/tb_package.toml -n report \
#       tenant_id=testtenant001 datapoints=200
#
# 【用量查詢】
#   # 查詢所有 Tenant
#   ./nats-runner -t templates/tb_package.toml -n usage_srp \
#       start_time=2026-05-01T00:00:00Z end_time=2026-05-31T23:59:59Z
#
#   # 查詢特定 Tenant
#   ./nats-runner -t templates/tb_package.toml -n usage_srp_by_tenant \
#       tenant_id=testtenant001 \
#       start_time=2026-05-01T00:00:00Z end_time=2026-05-31T23:59:59Z
#
#   # 從 resource 視角查詢
#   ./nats-runner -t templates/tb_package.toml -n usage_resource \
#       start_time=2026-05-01T00:00:00Z end_time=2026-05-31T23:59:59Z
#
#   ./nats-runner -t templates/tb_package.toml -n usage_resource_by_tenant \
#       tenant_id=testtenant001 \
#       start_time=2026-05-01T00:00:00Z end_time=2026-05-31T23:59:59Z
#
# 【清除（依序執行）】
#   1. 刪除 SRP type
#      ./nats-runner -t templates/tb_package.toml -n srp_delete
#
#   2. 刪除 resource type
#      ./nats-runner -t templates/tb_package.toml -n resource_delete

# ================================================================
# ResourceType：twinbuilder
# ================================================================

# ----------------------------------------------------------------
# 建立 twinbuilder ResourceType
# ----------------------------------------------------------------
[resource_create]
subject  = "eco1j.infra.metering.resource-types.create"
mode     = "req"
defaults = { resource_type = "twinbuilder", description = "TwinBuilder resource", metric_field = "datapoints", metric_type = "sum" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "resourceType": "{{resource_type}}",
    "description":  "{{description}}",
    "metrics": [
      {
        "field": "{{metric_field}}",
        "type":  "{{metric_type}}"
      }
    ]
  }
}
"""

# ----------------------------------------------------------------
# 查詢 twinbuilder ResourceType
# ----------------------------------------------------------------
[resource_get]
subject  = "eco1j.infra.metering.resource-types.get"
mode     = "req"
defaults = { resource_type = "twinbuilder" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "resourceType": "{{resource_type}}"
  }
}
"""

# ----------------------------------------------------------------
# 列出所有 ResourceType
# ----------------------------------------------------------------
[resource_list]
subject = "eco1j.infra.metering.resource-types.list"
mode    = "req"
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {}
}
"""

# ----------------------------------------------------------------
# 更新 twinbuilder ResourceType 說明
# ----------------------------------------------------------------
[resource_update]
subject  = "eco1j.infra.metering.resource-types.update"
mode     = "req"
defaults = { resource_type = "twinbuilder" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "resourceType": "{{resource_type}}",
    "description":  "{{description}}"
  }
}
"""

# ----------------------------------------------------------------
# 刪除 twinbuilder ResourceType
# ----------------------------------------------------------------
[resource_delete]
subject  = "eco1j.infra.metering.resource-types.delete"
mode     = "req"
defaults = { resource_type = "twinbuilder" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "resourceType": "{{resource_type}}"
  }
}
"""

# ================================================================
# SRPType：tb-package
# ================================================================

# ----------------------------------------------------------------
# 建立 tb-package SRPType
# ----------------------------------------------------------------
[srp_create]
subject  = "eco1j.infra.metering.srp-types.create"
mode     = "req"
defaults = { srp_type = "tb-package", description = "TwinBuilder package", resource1 = "twinbuilder", metric_field = "datapoints", metric_type = "sum" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "srpType":     "{{srp_type}}",
    "description": "{{description}}",
    "resources":   ["{{resource1}}"],
    "metrics": [
      {
        "field": "{{metric_field}}",
        "type":  "{{metric_type}}"
      }
    ]
  }
}
"""

# ----------------------------------------------------------------
# 查詢 tb-package SRPType
# ----------------------------------------------------------------
[srp_get]
subject  = "eco1j.infra.metering.srp-types.get"
mode     = "req"
defaults = { srp_type = "tb-package" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "srpType": "{{srp_type}}"
  }
}
"""

# ----------------------------------------------------------------
# 列出所有 SRPType
# ----------------------------------------------------------------
[srp_list]
subject = "eco1j.infra.metering.srp-types.list"
mode    = "req"
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {}
}
"""

# ----------------------------------------------------------------
# 更新 tb-package SRPType 說明
# ----------------------------------------------------------------
[srp_update]
subject  = "eco1j.infra.metering.srp-types.update"
mode     = "req"
defaults = { srp_type = "tb-package" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "srpType":     "{{srp_type}}",
    "description": "{{description}}"
  }
}
"""

# ----------------------------------------------------------------
# 刪除 tb-package SRPType
# ----------------------------------------------------------------
[srp_delete]
subject  = "eco1j.infra.metering.srp-types.delete"
mode     = "req"
defaults = { srp_type = "tb-package" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "srpType": "{{srp_type}}"
  }
}
"""

# ================================================================
# Usage Stats — SRP 視角（tb-package）
# ================================================================

# ----------------------------------------------------------------
# 查詢 tb-package 所有 Tenant 用量
# 必填 CLI 參數：start_time  end_time
# ----------------------------------------------------------------
[usage_srp]
subject  = "eco1j.infra.metering.usage-stats.srp"
mode     = "req"
defaults = { srp_type = "tb-package", skip_count = "0", max_result_count = "20" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "srpType":        "{{srp_type}}",
    "startTime":      "{{start_time}}",
    "endTime":        "{{end_time}}",
    "skipCount":      {{skip_count}},
    "maxResultCount": {{max_result_count}}
  }
}
"""

# ----------------------------------------------------------------
# 查詢 tb-package 指定 Tenant 用量
# 必填 CLI 參數：tenant_id  start_time  end_time
# ----------------------------------------------------------------
[usage_srp_by_tenant]
subject  = "eco1j.infra.metering.usage-stats.srp"
mode     = "req"
defaults = { srp_type = "tb-package", skip_count = "0", max_result_count = "20" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "srpType":        "{{srp_type}}",
    "tenantId":       "{{tenant_id}}",
    "startTime":      "{{start_time}}",
    "endTime":        "{{end_time}}",
    "skipCount":      {{skip_count}},
    "maxResultCount": {{max_result_count}}
  }
}
"""

# ================================================================
# Usage Stats — Resource 視角（twinbuilder）
# ================================================================

# ----------------------------------------------------------------
# 查詢 twinbuilder 所有 Tenant 用量（供應商視角）
# 必填 CLI 參數：start_time  end_time
# ----------------------------------------------------------------
[usage_resource]
subject  = "eco1j.infra.metering.usage-stats.resource"
mode     = "req"
defaults = { resource_type = "twinbuilder", skip_count = "0", max_result_count = "20" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "resourceType":   "{{resource_type}}",
    "startTime":      "{{start_time}}",
    "endTime":        "{{end_time}}",
    "skipCount":      {{skip_count}},
    "maxResultCount": {{max_result_count}}
  }
}
"""

# ----------------------------------------------------------------
# 查詢 twinbuilder 指定 Tenant 用量（供應商視角）
# 必填 CLI 參數：tenant_id  start_time  end_time
# ----------------------------------------------------------------
[usage_resource_by_tenant]
subject  = "eco1j.infra.metering.usage-stats.resource"
mode     = "req"
defaults = { resource_type = "twinbuilder", skip_count = "0", max_result_count = "20" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "resourceType":   "{{resource_type}}",
    "tenantId":       "{{tenant_id}}",
    "startTime":      "{{start_time}}",
    "endTime":        "{{end_time}}",
    "skipCount":      {{skip_count}},
    "maxResultCount": {{max_result_count}}
  }
}
"""

# ================================================================
# Usage Report — JetStream 上報（twinbuilder datapoints）
# ================================================================

# ----------------------------------------------------------------
# 上報 twinbuilder 用量（JetStream Fire-and-Forget）
# 必填 CLI 參數：tenant_id  datapoints
# resource_id 預設為 tb-package（SRP 名稱），可覆蓋
# ----------------------------------------------------------------
[report]
subject  = "eco1j.infra.metering.usage.create"
mode     = "js"
defaults = { resource_type = "twinbuilder", resource_id = "tb-package" }
body = """
{
  "reqSeqId":  "{{uuid}}",
  "timestamp": {{now_ms}},
  "data": {
    "usages": [
      {
        "tenantId":     "{{tenant_id}}",
        "resourceType": "{{resource_type}}",
        "resourceId":   "{{resource_id}}",
        "metrics": {
          "datapoints": {{datapoints}}
        },
        "timestamp": {{now_ms}}
      }
    ]
  }
}
"""

[report.stream]
create          = true
name            = "METERING-USAGE"
subjects        = ["eco1j.infra.metering.usage.>"]
storage         = "file"
max_age_seconds = 2592000
max_msgs        = 10000000
