# IoT Suite / iotsuite 一體化模板
# 涵蓋：SRPType(iotsuite) CRUD、Usage Stats 查詢、用量上報
# Metrics：tag、dashboard、user、eventrule（皆為 sum）
#
# 內建變數：{{ uuid }}（UUID v4）、{{ now_ms }}（epoch ms）
#
# ── 快速上手 ─────────────────────────────────────────────────────
#
# 【初始化】
#   ./nats-runner -t templates/iot_suite.toml -n srp_create
#
# 【用量上報（JetStream）】
#   # 只上報有變動的指標，其餘預設為 0
#   ./nats-runner -t templates/iot_suite.toml -n report \
#       tenant_id=testtenant001 tag=10 dashboard=2 user=5 eventrule=1
#
# 【用量查詢】
#   ./nats-runner -t templates/iot_suite.toml -n usage_srp \
#       start_time=2026-05-01T00:00:00Z end_time=2026-05-31T23:59:59Z
#
#   ./nats-runner -t templates/iot_suite.toml -n usage_srp_by_tenant \
#       tenant_id=testtenant001 \
#       start_time=2026-05-01T00:00:00Z end_time=2026-05-31T23:59:59Z
#
# 【清除】
#   ./nats-runner -t templates/iot_suite.toml -n srp_delete

# ================================================================
# SRPType：iotsuite
# ================================================================

# ----------------------------------------------------------------
# 建立 iotsuite SRPType（4 個 metrics，一次到位）
# ----------------------------------------------------------------
[srp_create]
subject  = "eco1j.infra.metering.srp-types.create"
mode     = "req"
defaults = { srp_type = "iotsuite", description = "IoT Suite package" }
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "srpType":     "{{ .srp_type }}",
    "description": {{ .description | toJson }},
    "resources":   [],
    "metrics": [
      { "field": "tag",       "type": "sum" },
      { "field": "dashboard", "type": "sum" },
      { "field": "user",      "type": "sum" },
      { "field": "eventrule", "type": "sum" }
    ]
  }
}
"""

# ----------------------------------------------------------------
# 查詢 iotsuite SRPType
# ----------------------------------------------------------------
[srp_get]
subject  = "eco1j.infra.metering.srp-types.get"
mode     = "req"
defaults = { srp_type = "iotsuite" }
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "srpType": "{{ .srp_type }}"
  }
}
"""

# ----------------------------------------------------------------
# 列出所有 SRPType
# ----------------------------------------------------------------
[srp_list]
subject = "eco1j.infra.metering.srp-types.list"
mode    = "req"
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {}
}
"""

# ----------------------------------------------------------------
# 更新 iotsuite SRPType 說明
# ----------------------------------------------------------------
[srp_update]
subject  = "eco1j.infra.metering.srp-types.update"
mode     = "req"
defaults = { srp_type = "iotsuite" }
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "srpType":     "{{ .srp_type }}",
    "description": {{ .description | toJson }}
  }
}
"""

# ----------------------------------------------------------------
# 刪除 iotsuite SRPType
# ----------------------------------------------------------------
[srp_delete]
subject  = "eco1j.infra.metering.srp-types.delete"
mode     = "req"
defaults = { srp_type = "iotsuite" }
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "srpType": "{{ .srp_type }}"
  }
}
"""

# ================================================================
# Usage Stats — SRP 視角（iotsuite）
# ================================================================

# ----------------------------------------------------------------
# 查詢 iotsuite 所有 Tenant 用量
# 必填 CLI 參數：start_time  end_time
# ----------------------------------------------------------------
[usage_srp]
subject  = "eco1j.infra.metering.usage-stats.srp"
mode     = "req"
defaults = { srp_type = "iotsuite", skip_count = "0", max_result_count = "20" }
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "srpType":        "{{ .srp_type }}",
    "startTime":      "{{ .start_time }}",
    "endTime":        "{{ .end_time }}",
    "skipCount":      {{ .skip_count }},
    "maxResultCount": {{ .max_result_count }}
  }
}
"""

# ----------------------------------------------------------------
# 查詢 iotsuite 指定 Tenant 用量
# 必填 CLI 參數：tenant_id  start_time  end_time
# ----------------------------------------------------------------
[usage_srp_by_tenant]
subject  = "eco1j.infra.metering.usage-stats.srp"
mode     = "req"
defaults = { srp_type = "iotsuite", skip_count = "0", max_result_count = "20" }
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "srpType":        "{{ .srp_type }}",
    "tenantId":       "{{ .tenant_id }}",
    "startTime":      "{{ .start_time }}",
    "endTime":        "{{ .end_time }}",
    "skipCount":      {{ .skip_count }},
    "maxResultCount": {{ .max_result_count }}
  }
}
"""

# ================================================================
# Usage Report — JetStream 上報（iotsuite 4 metrics）
# ================================================================

# ----------------------------------------------------------------
# 上報 iotsuite 用量（JetStream Fire-and-Forget）
# 必填 CLI 參數：tenant_id
# 未指定的 metric 預設為 0，只需帶有變動的值即可
#
# 範例：
#   ./nats-runner -t templates/iot_suite.toml -n report \
#       tenant_id=testtenant001 tag=10 user=5
# ----------------------------------------------------------------
[report]
subject  = "eco1j.infra.metering.usage.create"
mode     = "js"
defaults = { resource_type = "iotsuite", resource_id = "iotsuite", tag = "0", dashboard = "0", user = "0", eventrule = "0" }
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "usages": [
      {
        "tenantId":     "{{ .tenant_id }}",
        "resourceType": "{{ .resource_type }}",
        "resourceId":   "{{ .resource_id }}",
        "metrics": {
          "tag":       {{ .tag }},
          "dashboard": {{ .dashboard }},
          "user":      {{ .user }},
          "eventrule": {{ .eventrule }}
        },
        "timestamp": {{ now_ms }}
      }
    ]
  }
}
"""

[report.stream]
create          = true
name            = "METERING-USAGE"
subjects        = ["eco1j.infra.metering.usage.>"]
storage         = "file"
max_age_seconds = 2592000
max_msgs        = 10000000
