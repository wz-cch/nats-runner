# ResourceType 管理模板
# 內建變數：{{ uuid }}（UUID v4）、{{ now_ms }}（epoch ms）、{{ now_iso }}（RFC3339）、{{ now }}（epoch s）
#
# 使用範例：
#   ./nats-runner -t templates/resource_types.toml -n create resource_type=compute description="運算資源" metric_field=vcpu_count
#   ./nats-runner -t templates/resource_types.toml -n get    resource_type=compute
#   ./nats-runner -t templates/resource_types.toml -n list
#   ./nats-runner -t templates/resource_types.toml -n update resource_type=compute description="更新說明"
#   ./nats-runner -t templates/resource_types.toml -n delete resource_type=compute

# ----------------------------------------------------------------
# 建立 ResourceType（含單一 metric）
# ----------------------------------------------------------------
[create]
subject = "eco1j.infra.metering.resource-types.create"
mode    = "req"
defaults = { metric_type = "sum" }
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "resourceType": "{{ .resource_type }}",
    "description":  "{{ .description }}",
    "metrics": [
      {
        "field": "{{ .metric_field }}",
        "type":  "{{ .metric_type }}"
      }
    ]
  }
}
"""

# ----------------------------------------------------------------
# 查詢單一 ResourceType
# ----------------------------------------------------------------
[get]
subject = "eco1j.infra.metering.resource-types.get"
mode    = "req"
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "resourceType": "{{ .resource_type }}"
  }
}
"""

# ----------------------------------------------------------------
# 查詢全部 ResourceType
# ----------------------------------------------------------------
[list]
subject = "eco1j.infra.metering.resource-types.list"
mode    = "req"
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {}
}
"""

# ----------------------------------------------------------------
# 更新 ResourceType（resourceType 為必要欄位）
# ----------------------------------------------------------------
[update]
subject = "eco1j.infra.metering.resource-types.update"
mode    = "req"
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "resourceType": "{{ .resource_type }}",
    "description":  "{{ .description }}"
  }
}
"""

# ----------------------------------------------------------------
# 刪除 ResourceType
# 注意：若有 SRPType 引用此 ResourceType 則會回傳 resource_type_in_use 錯誤
# ----------------------------------------------------------------
[delete]
subject = "eco1j.infra.metering.resource-types.delete"
mode    = "req"
body = """
{
  "reqSeqId":  "{{ uuid }}",
  "timestamp": {{ now_ms }},
  "data": {
    "resourceType": "{{ .resource_type }}"
  }
}
"""
